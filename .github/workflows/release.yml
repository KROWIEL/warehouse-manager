name: Release

# Тег v* → проверки из CI → GitHub Release с описанием из аннотации тега.

on:
  push:
    tags: ['v*']

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && { echo "Релиз $TAG уже есть"; exit 0; }
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents:body)' "$TAG" > notes.md
          gh release create "$TAG" --title "Store Manager ${TAG#v}" --notes-file notes.md --verify-tag --latest
